services:
  download_manager:
    container_name: download_manager
    image: ghcr.io/yzard/download_manager:4.0.2
    env_file:
      - ./.env
    volumes:
      - ./config:/config
      - ./data/download_manager:/data
      - /data/downloads/baidu:/downloads
    ports:
      - "127.0.0.1:8085:8080"
    restart: always
