name: Publish Download Manager image

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-download-manager
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish platform image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx create --driver docker-container --use
          ./build_docker.sh --publish-platform "linux/$ARCH" "$RUNNER_TEMP/metadata.json"
          jq -er '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "digest-$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and verify the multi-platform tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versioned=$(./build_docker.sh --image)
          image=${versioned%:*}
          main_version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=main" --jq .content | base64 --decode)
          test "$versioned" = "$image:$main_version"
          for arch in amd64 arm64; do
            grep -Eq '^sha256:[0-9a-f]{64}$' "digest-$arch.txt"
          done
          docker buildx imagetools create --tag "$versioned" --tag "$image:latest" \
            "$image@$(cat digest-amd64.txt)" "$image@$(cat digest-arm64.txt)"
          version_digest=$(docker buildx imagetools inspect "$versioned" --format '{{.Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
          test -n "$version_digest"
          test "$version_digest" = "$latest_digest"
