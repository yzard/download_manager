name: Publish Download Manager image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - Cargo.toml
      - Cargo.lock
      - schema.sql
      - 'src/**'
      - 'web/**'
      - LICENSE.BaiduPCS-Go
      - Dockerfile.dockerignore
      - build_docker.sh
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-download-manager
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish
        run: |
          docker buildx create --driver docker-container --use
          ./build_docker.sh --publish
