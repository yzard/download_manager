[package]
name = "download_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
getrandom = "0.4"
rpassword = "7"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"
