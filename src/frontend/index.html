<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1>Download Manager</h1>
      </div>
      <div id="account-actions" class="account-actions" hidden>
      <span id="signed-in-user" class="muted"></span>
      <button id="open-settings" disabled class="icon-button" type="button" aria-label="设置" title="设置" data-label="settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="m10 3-.6 2.2-1.6.9-2.2-.6-2 3.5 1.6 1.6v1.8L3.6 14l2 3.5 2.2-.6 1.6.9.6 2.2h4l.6-2.2 1.6-.9 2.2.6 2-3.5-1.6-1.6v-1.8l1.6-1.6-2-3.5-2.2.6-1.6-.9L14 3z"/>
          <circle cx="12" cy="11.5" r="3"/>
        </svg>
      </button>
      <button id="logout" type="button" data-text="logout">退出</button>
      </div>
    </header>

    <section id="login-panel" class="panel login-panel" aria-labelledby="login-title">
      <h2 id="login-title" data-text="login">登录</h2>
      <p id="login-message" class="muted" role="status">正在连接</p>
      <form id="login-form" hidden>
        <label><span data-text="username">用户名</span> <input name="username" autocomplete="username" maxlength="64" required></label>
        <label><span data-text="password">密码</span> <input name="password" type="password" autocomplete="current-password" required></label>
        <p class="error" role="alert"></p>
        <div class="actions"><button type="submit" class="primary" data-text="login">登录</button></div>
      </form>
      <form id="account-setup-form" hidden>
        <label><span data-text="setupCode">一次性设置码</span> <input name="setup_code" type="password" autocomplete="off" spellcheck="false" maxlength="64" required></label>
        <p class="muted" data-text="setupCodeHelp">在 NAS 终端运行 setup-code 命令获取设置码。</p>
        <label><span data-text="username">用户名</span> <input name="username" autocomplete="username" maxlength="64" pattern="[A-Za-z0-9._\-]+" required></label>
        <label><span data-text="password">密码</span> <input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
        <label><span data-text="confirmPassword">确认密码</span> <input name="confirm_password" type="password" autocomplete="new-password" required></label>
        <p class="error" role="alert"></p>
        <div class="actions"><button type="submit" class="primary" data-text="saveAccount">保存账号</button></div>
      </form>
    </section>

    <section id="downloads-panel" aria-labelledby="downloads-title" class="panel" hidden>
      <div class="panel-header">
        <div>
          <h2 id="downloads-title" data-text="downloads">百度网盘下载</h2>
          <p id="monitor-directory" class="muted"></p>
        </div>
        <div class="download-view">
          <p id="service-status" class="status" role="status" data-text="connecting">正在连接</p>
          <label for="download-filter" class="download-filter">
            <span data-text="downloadFilter">显示</span>
            <select id="download-filter">
              <option value="active" selected data-text="activeDownloads">进行中</option>
              <option value="all" data-text="allDownloads">全部</option>
            </select>
          </label>
        </div>
      </div>
      <p id="queue-error" class="error queue-error" role="alert" hidden></p>
      <div class="table-scroll">
        <table>
          <colgroup>
            <col data-column="source">
            <col data-column="file">
            <col data-column="size">
            <col data-column="progress">
            <col data-column="speed">
            <col data-column="status">
            <col data-column="taskActions">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" data-column="source"><span data-text="source">来源</span></th>
              <th scope="col" data-column="file"><span data-text="file">文件</span></th>
              <th scope="col" data-column="size"><span data-text="size">大小</span></th>
              <th scope="col" data-column="progress"><span data-text="progress">进度</span></th>
              <th scope="col" data-column="speed"><span data-text="speed">速度</span></th>
              <th scope="col" data-column="status"><span data-text="status">状态</span></th>
              <th scope="col"><span data-text="taskActions">操作</span></th>
            </tr>
          </thead>
          <tbody id="downloads"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" data-text="connectingDownloads">正在连接下载服务</p>
    </section>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title" data-text="settings">设置</h2>
    <form id="general-settings-form">
      <fieldset class="settings-section">
        <legend data-text="general">常规</legend>
        <label><span data-text="downloadDirectory">下载保存位置</span> <input name="download_directory" required spellcheck="false" placeholder="/downloads" maxlength="4096"></label>
        <label><span data-text="language">界面语言</span>
          <select name="language">
            <option value="zh-CN" lang="zh-CN">中文</option>
            <option value="en" lang="en">English</option>
          </select>
        </label>
        <label><span data-text="baseUrl">访问路径（Base URL）</span> <input name="base_url" placeholder="/download-manager" maxlength="257" required spellcheck="false" aria-describedby="base-url-help"></label>
        <p id="base-url-help" class="muted"></p>
        <p class="error" role="alert"></p>
        <p class="muted" role="status" hidden data-text="settingsSaved">设置已保存。</p>
        <div class="actions"><button class="primary" type="submit" data-text="saveGeneral">保存常规设置</button></div>
      </fieldset>
    </form>
    <form id="settings-form" autocomplete="off">
      <fieldset class="settings-section">
        <legend data-text="baidu">百度网盘</legend>
        <p class="muted" id="settings-description"></p>
        <label>BDUSS <input name="bduss" type="password" spellcheck="false" maxlength="4096"></label>
        <label>STOKEN <input name="stoken" type="password" spellcheck="false" maxlength="4096"></label>
        <label><span data-text="monitorDirectory">网盘监控目录</span> <input name="monitor_directory" required spellcheck="false" placeholder="/NAS下载" maxlength="4096"></label>
        <label><span data-text="checkInterval">检查间隔（秒）</span> <input name="check_interval_seconds" type="number" min="1" max="4294967295" step="1" required></label>
        <label class="checkbox-option"><input name="delete_after_download" type="checkbox" aria-describedby="baidu-recycle-help"> <span data-text="deleteAfterDownload">下载完成后删除云端原文件</span></label>
        <p class="muted checkbox-help" id="baidu-recycle-help" data-text="deleteAfterDownloadHelp">本地文件通过完整性校验后，原文件会移到百度网盘回收站。</p>
        <label class="checkbox-option"><input name="delete_on_remove" type="checkbox" aria-describedby="baidu-remove-help"> <span data-text="deleteOnRemove">移除任务时也删除云端原文件</span></label>
        <p class="muted checkbox-help" id="baidu-remove-help" data-text="deleteOnRemoveHelp">点击任务旁的叉号时，原文件会移到百度网盘回收站，即使下载尚未完成。</p>
        <p class="error" role="alert"></p>
        <p class="muted" role="status" hidden data-text="settingsSaved">设置已保存。</p>
        <div class="actions"><button class="primary" type="submit" data-text="saveBaidu">保存百度设置</button></div>
      </fieldset>
    </form>
    <section class="account-settings" aria-labelledby="account-settings-title">
      <h3 id="account-settings-title" data-text="account">账号</h3>
      <button id="open-password" type="button" data-text="changePassword">修改登录密码</button>
    </section>
    <p class="provider-note muted" data-text="xunlei">迅雷 · 待接入</p>
    <div class="actions"><button id="close-settings" type="button" data-text="close">关闭</button></div>
  </dialog>
  <dialog id="password-dialog" aria-labelledby="password-title">
    <form id="password-form">
      <h2 id="password-title" data-text="changePassword">修改登录密码</h2>
      <p class="muted" data-text="changePasswordHint">新密码至少 12 个字符。保存后请重新登录。</p>
      <label><span data-text="currentPassword">当前密码</span> <input name="current_password" type="password" autocomplete="current-password" required></label>
      <label><span data-text="newPassword">新密码</span> <input name="new_password" type="password" autocomplete="new-password" required minlength="12"></label>
      <label><span data-text="confirmNewPassword">确认新密码</span> <input name="confirm_password" type="password" autocomplete="new-password" required></label>
      <p class="error" role="alert"></p>
      <div class="actions">
        <button id="close-password" type="button" data-text="cancel">取消</button>
        <button class="primary" type="submit" data-text="savePassword">保存密码</button>
      </div>
    </form>
  </dialog>
</body>
</html>
